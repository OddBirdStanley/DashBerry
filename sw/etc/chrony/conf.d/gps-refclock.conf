# chrony <- gpsd shared-memory refclock. NMEA-only pucks (VK-162, no PPS) are
# good to a few hundred ms — plenty for footage<->GPS correlation; the DS3231
# carries time from cold boot until this takes over.
# VERIFY on bench: `chronyc sources` should show NMEA reachable after fix.
refclock SHM 0 refid NMEA offset 0.2 delay 0.5 noselect
# Drop `noselect` after bench-checking the offset against a sane source, or
# leave it if the RTC + occasional manual sync is deemed enough.
