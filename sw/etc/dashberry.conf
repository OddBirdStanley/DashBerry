# dashberry.conf — single tuning point for the DashBerry runtime, as the card
# was BUILT. Sourced by every shell script in /usr/local/bin. POSIX sh syntax,
# no spaces around '='. dashberry-panel (C) reads exactly five keys from here:
# UNITS, BYPASS_TIME, BYPASS_REAR, RF_JOIN, CLOCK_FLOOR.
#
# What the USER later chooses on the panel (PAGE 3+) lives in
# /data/settings.conf instead — this file is on the read-only OS volume, and
# those choices have to survive a reboot. Where the two overlap (UNITS vs
# speed_unit) the panel's stored choice wins.

# --- storage ---
DATA=/data
RETENTION_FLOOR_MB=1024        # 1 GiB. Retention deletes oldest segments below
                               # this free space. Retention's own target ONLY:
                               # the panel's Storage ERR fires at 0-free/
                               # read-only/I/O-errors, not at this floor.
                               # Headroom check against the sweep interval:
                               # retention.timer runs every 5 min, and
                               # 8+4 Mbps is ~450 MB written per interval, so
                               # a sweep leaves ~570 MB standing when the next
                               # one fires — roughly two missed sweeps of
                               # margin. Raising the bitrates further, or
                               # lengthening the timer, eats that margin
                               # directly.

# --- video ---
FRONT_W=1920
FRONT_H=1080
FRONT_FPS=30
FRONT_BITRATE=8000000          # bits/s. ~0.129 bit/pixel at 1080p30, which
                               # puts the front at the BOTTOM of where
                               # commercial dashcams sit at this resolution
                               # (8-15 Mbps, 0.13-0.24 bpp) rather than four to
                               # seven times under it, which is where the old
                               # 2 Mbps default (~0.032 bpp) sat.
                               # 2 Mbps was the leading explanation for footage
                               # reading soft while stills off the same camera
                               # are sharp — INVESTIGATE-FOCUS.md candidate 3.
                               # Raising it does NOT close that candidate: no
                               # 8 Mbps footage off this camera has been LOOKED
                               # at yet, so whether the softness actually goes
                               # away is still unverified. The sample grid that
                               # settles it is cam/rootscripts/sample-grid (a
                               # ROOTSCRIPT, outside this repo): 3 bitrates x 3
                               # denoise modes on the front, and it also answers
                               # whether the daytime sky banding is the encoder
                               # at all or the ISP's colour denoise. Shoot it
                               # and look before treating this as settled.
                               # The trade being spent is real and is the
                               # reason this sat at 2 for so long: 2+2 Mbps
                               # ~ 1.8 GB/h -> ~120 h on the 256 GB card,
                               # 8+4 ~ 5.4 GB/h -> ~40 h. That is a deliberate
                               # choice of picture over drive history.
FRONT_GOP=27                   # frames between keyframes (rpicam-vid --intra).
                               # 27 @ 30 fps = 0.9 s, DELIBERATELY not 30: a
                               # 1 s keyframe cadence phase-locks to ext4's
                               # 1 Hz commit=1 tick, and every page the commit
                               # zeroed then landed on an IDR (10/10 across two
                               # measured segments), costing a whole GOP each
                               # time. Detuning sweeps the phase every 9 s.
                               # Also caps the resync distance for a reader
                               # landing mid-file at 0.9 s. See
                               # usr/local/bin/front-rec.
FRONT_LENS_DIOPTRE=3.63        # manual focus position for the AF front camera.
                               # NOMINALLY reciprocal metres (0.0 = infinity,
                               # 1.0 = 1 m) — but on THIS unit the scale is
                               # offset: the VCM/tuning-file pairing is
                               # per-module and nominal 0.0 focuses visibly
                               # soft. 3.63 is the centre of the converged
                               # AF cluster from the bench (7 runs, 5 in
                               # 3.50-3.85 after dropping two near-subject
                               # outliers), locked by VISUAL confirmation of
                               # road footage (2026-08-05). 4.0 is already
                               # visibly soft — the usable band on this unit
                               # is tighter than the nominal +-0.4 hyperfocal
                               # tolerance, so treat +-0.15 as the margin.
                               # The number is a calibration for this exact
                               # module, not a distance: recalibrate
                               # (front-check sections 5-7, then eyes) if the
                               # camera module is ever replaced. rpicam's own
                               # "default" position is the tuning file's
                               # (~1 m) and was what made every clip soft
                               # originally
REAR_W=1280
REAR_H=720
REAR_FPS=30
REAR_BITRATE=4000000           # ~0.145 bit/pixel at 720p30 — the same
                               # per-pixel budget the front now gets at
                               # 8 Mbps/1080p30, so neither camera is the
                               # obviously weak one. Raised from 2 Mbps
                               # alongside the front; the rear also carries
                               # REAR_GAMMA's shadow lift, which amplifies
                               # sensor noise and spends bitrate on it (see
                               # REAR_GAMMA below). Unverified on picture for
                               # the same reason as the front.
REAR_GOP=27                    # openh264enc gop-size; same 0.9 s detune and
                               # same reason as FRONT_GOP above.
REAR_GAMMA=1.4                 # shadow lift applied to the rear picture after
                               # decode (gst `gamma` element, Y plane only).
                               # 1.0 = element omitted entirely. The rear
                               # camera is too dark at night while the front
                               # (IMX708, HDR) is fine, and when this was
                               # written the Zero's image was not ours to
                               # retune — so the lift happens here. That rule
                               # was RETIRED 2026-08-11 (the Zero can be
                               # altered; IMPL.md "Explicitly not built"), so
                               # a source-side exposure/tuning fix now
                               # competes with this element and is the better
                               # place for it — this one lifts shadow noise
                               # into a 4 Mbps baseline encode.
                               # Gamma rather than a brightness offset
                               # BECAUSE it is self-balancing: the curve is
                               # pinned at both ends, so near-black night
                               # pixels move a lot and daylight highlights
                               # barely at all — one static value serves both,
                               # and a bright sky cannot be clipped. Measured
                               # off this very element (desk, 2026-08-04),
                               # output for input Y:
                               #   gamma  Y8   Y16  Y64  Y128 Y235
                               #   1.2    14   25   81   144  238
                               #   1.4    22   35   95   156  241
                               #   1.6    29   45  107   166  242
                               # 1.4 = deep shadows ~2.8x, midtones +11%,
                               # highlights +2%. Bench range 1.2 (timid) to
                               # 1.6 (day starts looking washed). It amplifies
                               # sensor noise with the signal, which costs
                               # bitrate on a night scene: if 60 s segments
                               # start looking smeared, raise REAR_BITRATE
                               # before lowering this
SEGMENT_NS=60000000000         # splitmuxsink max-size-time (60 s in ns). Segments
                               # are MPEG-TS: no index, so a segment truncated by
                               # a power cut still reads up to the cut, and there
                               # is no fragment size to tune against it

# --- session ---
SESSION_FILE=/run/dashberry/session   # per-boot session name, minted by session-init;
                                      # recorders and gps-log read it, never mint their own
CLOCK_FLOOR=1767225600         # 2026-01-01 UTC. A wall clock reading before this
                               # is definitely wrong (the card did not exist),
                               # so session-init waits briefly for the RTC and
                               # then warns instead of minting a 1970-dated
                               # session name. The panel tests the DS3231's own
                               # value against the same floor, so a never-set
                               # RTC (which answers 2000-01-01, perfectly
                               # readable) faults TIME on PAGE 0 instead of
                               # passing. See INVESTIGATE-TIMESTAMPS.md

# --- devices ---
REAR_CAM_DEV=/dev/rear-cam     # udev symlink; see etc/udev/rules.d/99-dashberry.rules
GPS_DEV=/dev/gps0              # u-blox puck via udev symlink (99-dashberry.rules);
                               # a replug re-enumerates ttyACM0 -> ttyACM1, so the
                               # raw node is never pinned. gps-rate writes the UBX
                               # 5 Hz command here before gpsd claims it

# --- panel ---
UNITS=MPH                      # PAGE 1 speed units: MPH or KMH

# --- bypass (installed configuration; set by dashberry-install --bypass-*) ---
BYPASS_TIME=0                  # 1 = no DS3231 fitted: TIME is pinned OK in the
                               # panel (never on PAGE 0); chrony trusts GPS for
                               # wall time instead (firstinstall.sh)
BYPASS_REAR=0                  # 1 = no rear camera: rear-rec is never enabled
                               # and REAR is pinned OK (never on PAGE 0)

# --- mounting (installed configuration; set by dashberry-install --invert-*) ---
INVERT_FRONT=                  # the axes this camera's mounting has to be
                               # corrected on, comma separated: v = it is
                               # mounted upside down, h = its image comes out
                               # mirrored, v,h = both, empty = neither. Flipped
                               # AT CAPTURE by the ISP, free (rpicam-vid
                               # --vflip/--hflip)
INVERT_REAR=                   # same axes for the rear camera, corrected in
                               # the pipeline instead (videoflip, after the
                               # MJPEG decode); v,h collapses to one rotate-180
                               # element, so two axes cost what one does
                               # Either way the footage on the card is already
                               # upright and un-mirrored: nothing downstream
                               # (panel health, dashberry-cli, any player) has
                               # to know how the camera was screwed to the glass

# --- install mode (set by dashberry-install --debug / --auth) ---
DEBUG=0                        # 0 = PRODUCTION: read-only OS, Wi-Fi traces
                               # wiped after firstinstall. 1 = DEBUG:
                               # writable OS, journal kept and made
                               # persistent, a staged --wifi profile kept.
                               # Read by firstinstall only — the panel does
                               # not care about the install mode any more,
                               # its glyph reports live RF state instead.
RF_JOIN=0                      # 1 = JOIN WIFI armed (an --auth card built
                               # without --debug): a 5 s button-A hold on the
                               # OLED brings the radios up and opens the
                               # SSID picker / passphrase keyboard. 0 = the
                               # hold does nothing and button A stays a
                               # reserved wake key. Independent of the boot
                               # RF state, which is ALWAYS killed: JOIN WIFI
                               # never survives a reboot.
RISKY_SCRIPTS=0                # 1 = PAGE SCRIPTS armed (dashberry-install
                               # --risky-scripts DIR, which REQUIRES --debug).
                               # A 5 s joystick-CENTER hold on any page —
                               # PAGE 0 included — stops both recorders and
                               # lists the executables deposited in
                               # /usr/local/lib/dashberry/scripts; CENTER runs
                               # the selected one AS ROOT, detached, with its
                               # output appended to /data/scripts/<name>.log.
                               # It is a ONE-WAY DOOR: no exit key, no
                               # AUTO-BLANK, no PAGE 0, and a reboot is the
                               # only way back. It exists so bench debugging
                               # stops meaning "scp the script again", and it
                               # is deliberately unavailable on any card a
                               # passenger could be sitting in front of.
                               # 0 = the hold does nothing and CENTER stays a
                               # reserved wake key.
