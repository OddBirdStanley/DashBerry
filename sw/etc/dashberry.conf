# dashberry.conf — single tuning point for the DashBerry runtime.
# Sourced by every shell script in /usr/local/bin. POSIX sh syntax, no spaces
# around '='. dashberry-panel (C) reads exactly one key from here: UNITS.

# --- storage ---
DATA=/data
RETENTION_FLOOR_MB=8192        # retention deletes oldest segments below this free
                               # space. Retention's own target ONLY (rev 6): the
                               # panel's Storage ERR fires at 0-free/read-only/
                               # I/O-errors (PLAN §3b), not at this floor.

# --- video ---
FRONT_W=1920
FRONT_H=1080
FRONT_FPS=30
FRONT_BITRATE=2000000          # bits/s
REAR_W=1280
REAR_H=720
REAR_FPS=30
REAR_BITRATE=2000000
SEGMENT_NS=60000000000         # splitmuxsink max-size-time (60 s in ns)
FRAGMENT_MS=1000               # mp4mux fragment-duration — crash-recoverable granularity

# --- session ---
SESSION_FILE=/run/dashberry/session   # per-boot session name, minted by session-init;
                                      # recorders and gps-log read it, never mint their own

# --- devices ---
REAR_CAM_DEV=/dev/rear-cam     # udev symlink; see etc/udev/rules.d/99-dashberry.rules
GPS_DEV=/dev/ttyACM0           # u-blox puck serial device; gps-rate writes the UBX
                               # 5 Hz command here before gpsd claims it

# --- panel ---
UNITS=MPH                      # PAGE 1 speed units: MPH or KMH (PLAN §3b)

# --- RF state (fail-closed) ---
RF_STATE_DIR=/data/rf
RF_STATE_FILE=/data/rf/state   # 1 byte: exactly "1" = radios allowed;
                               # anything else / missing = blocked
